<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akashify ⚡</title>

<style>
/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: #fff;
}

header {
    text-align: center;
    font-size: 28px;
    padding: 20px;
    color: #00f7ff;
    font-weight: bold;
}

/* ===== CARD ===== */
.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    margin: 15px;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,255,255,0.1);
}

/* ===== INPUT ===== */
input, textarea, select {
    width: 100%;
    margin: 5px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* ===== BUTTON ===== */
button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #00f7ff;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    transform: scale(1.05);
}

/* ===== TASK CARD ===== */
.post {
    margin: 15px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 10px rgba(0,255,255,0.1);
}

.completed {
    opacity: 0.5;
    text-decoration: line-through;
}

/* ===== PRIORITY ===== */
.high { border-left: 5px solid red; }
.medium { border-left: 5px solid orange; }
.low { border-left: 5px solid green; }

/* ===== TAG ===== */
.tag {
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 12px;
}

.math { background:red; }
.programming { background:#00f7ff; color:black; }
.biology { background:green; }

/* ===== STATS ===== */
.stats {
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.stats div {
    background: rgba(255,255,255,0.05);
    padding: 10px;
    border-radius: 10px;
    width: 30%;
}

/* ===== SEARCH ===== */
#search {
    width: 90%;
    margin: 15px;
    padding: 10px;
}

/* ===== FILTER ===== */
.filters {
    text-align: center;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    padding: 20px;
    opacity: 0.5;
}
</style>
</head>

<body>

<header>⚡ Akashify</header>

<!-- ADD TASK -->
<div class="card">
<h2>Add Task</h2>

<input id="title" placeholder="Title">
<textarea id="content" placeholder="Write..."></textarea>

<select id="category">
<option value="math">Math</option>
<option value="programming">Programming</option>
<option value="biology">Biology</option>
</select>

<input type="date" id="date">

<select id="priority">
<option value="high">🔥 High</option>
<option value="medium">⚡ Medium</option>
<option value="low">🌿 Low</option>
</select>

<button onclick="addPost()">Add</button>
</div>

<!-- SEARCH -->
<input id="search" placeholder="Search..." onkeyup="displayPosts()">

<!-- FILTER -->
<div class="filters">
<button onclick="filterTasks('all')">All</button>
<button onclick="filterTasks('math')">Math</button>
<button onclick="filterTasks('programming')">Programming</button>
<button onclick="filterTasks('biology')">Biology</button>
</div>

<!-- STATS -->
<div class="card stats">
<div>Total<br><span id="total">0</span></div>
<div>Done<br><span id="done">0</span></div>
<div>Pending<br><span id="pending">0</span></div>
</div>

<!-- POSTS -->
<div id="posts"></div>

<footer>⚡ Stay Productive</footer>

<script>
// 🔔 Notification permission
if ("Notification" in window) {
    Notification.requestPermission();
}

let filter = "all";

// ADD
function addPost(){
    let title = document.getElementById("title").value;
    let content = document.getElementById("content").value;
    let category = document.getElementById("category").value;
    let date = document.getElementById("date").value;
    let priority = document.getElementById("priority").value;

    if(!title || !content) return alert("Fill all fields");

    let posts = JSON.parse(localStorage.getItem("posts")) || [];

    posts.push({title,content,category,date,priority,done:false});

    localStorage.setItem("posts",JSON.stringify(posts));
    displayPosts();
}

// DISPLAY
function displayPosts(){
    let posts = JSON.parse(localStorage.getItem("posts")) || [];
    let search = document.getElementById("search").value.toLowerCase();

    let output = "";
    let doneCount = 0;

    posts.forEach((p,i)=>{
        if(p.done) doneCount++;

        if(!p.title.toLowerCase().includes(search)) return;
        if(filter !== "all" && p.category !== filter) return;

        output += `
        <div class="post ${p.done?'completed':''} ${p.priority}">
            <span class="tag ${p.category}">${p.category}</span>
            <h3>${p.title}</h3>
            <p>${p.content}</p>
            <small>📅 ${p.date || "No date"}</small>

            <br>

            <button onclick="markDone(${i})">✔</button>
            <button onclick="remind(${i})">🔔</button>
            <button onclick="deletePost(${i})">❌</button>
        </div>`;
    });

    document.getElementById("posts").innerHTML = output;

    document.getElementById("total").innerText = posts.length;
    document.getElementById("done").innerText = doneCount;
    document.getElementById("pending").innerText = posts.length - doneCount;
}

// DONE
function markDone(i){
    let posts = JSON.parse(localStorage.getItem("posts"));
    posts[i].done = !posts[i].done;
    localStorage.setItem("posts",JSON.stringify(posts));
    displayPosts();
}

// DELETE
function deletePost(i){
    let posts = JSON.parse(localStorage.getItem("posts"));
    posts.splice(i,1);
    localStorage.setItem("posts",JSON.stringify(posts));
    displayPosts();
}

// FILTER
function filterTasks(cat){
    filter = cat;
    displayPosts();
}

// 🔔 REMINDER
function remind(i){
    let time = prompt("Remind after minutes?");
    if(!time) return;

    let posts = JSON.parse(localStorage.getItem("posts"));
    let delay = parseInt(time) * 60000;

    setTimeout(()=>{
        if(Notification.permission==="granted"){
            new Notification("🔔 Reminder",{body:posts[i].title});
        } else {
            alert(posts[i].title);
        }
    },delay);

    alert("Reminder set!");
}

window.onload = displayPosts;
</script>

</body>
</html>
