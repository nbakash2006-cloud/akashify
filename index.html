<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akashify ⚡</title>

<link rel="manifest" href="manifest.json">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body { font-family: Arial; background:#0f0f0f; color:white; text-align:center; }
input,button,textarea,select { margin:5px; padding:10px; border-radius:10px; }
.post { background:#1a1a1a; margin:10px; padding:10px; border-radius:10px; }
</style>
</head>

<body>

<h1>⚡ Akashify</h1>

<!-- LOGIN -->
<div id="auth">
<h2>Login / Signup</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<br>
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<h2>Add Task</h2>
<input id="title" placeholder="Title">
<textarea id="content"></textarea>

<select id="category">
<option>math</option>
<option>programming</option>
<option>biology</option>
</select>

<button onclick="addPost()">Add</button>
<button onclick="logout()">Logout</button>

<div id="posts"></div>

</div>

<script>
// 🔥 FIREBASE CONFIG (PUT YOURS HERE)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
};

// INIT
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// SIGNUP
function signup(){
    auth.createUserWithEmailAndPassword(email.value,password.value);
}

// LOGIN
function login(){
    auth.signInWithEmailAndPassword(email.value,password.value);
}

// LOGOUT
function logout(){
    auth.signOut();
}

// AUTH STATE
auth.onAuthStateChanged(user=>{
    if(user){
        authDiv.style.display="none";
        appDiv.style.display="block";
        loadPosts(user.uid);
    } else {
        authDiv.style.display="block";
        appDiv.style.display="none";
    }
});

const authDiv = document.getElementById("auth");
const appDiv = document.getElementById("app");

// ADD POST
function addPost(){
    let user = auth.currentUser;
    db.collection("posts").add({
        uid:user.uid,
        title:title.value,
        content:content.value,
        category:category.value,
        done:false
    });
}

// LOAD POSTS
function loadPosts(uid){
    db.collection("posts")
    .where("uid","==",uid)
    .onSnapshot(snapshot=>{
        let output="";
        snapshot.forEach(doc=>{
            let p=doc.data();
            output+=`
            <div class="post">
            <h3>${p.title}</h3>
            <p>${p.content}</p>
            <button onclick="deletePost('${doc.id}')">Delete</button>
            </div>`;
        });
        posts.innerHTML=output;
    });
}

// DELETE
function deletePost(id){
    db.collection("posts").doc(id).delete();
}

// NOTIFICATION
if(Notification.permission!=="granted"){
    Notification.requestPermission();
}
</script>

</body>
</html>
