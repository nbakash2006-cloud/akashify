<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akashify ⚡</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f7ff">

<link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins';
    background: #0f0f0f;
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    font-family: 'Orbitron';
    color: #00f7ff;
}

/* CARD */
.card, .post {
    background: #1a1a1a;
    padding: 15px;
    margin: 15px;
    border-radius: 15px;
    box-shadow: 0 0 10px #00f7ff44;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    background: #111;
    color: white;
}

button {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #00f7ff;
    cursor: pointer;
}

/* POSTS */
.post:hover {
    box-shadow: 0 0 15px #00f7ff;
}

.completed {
    opacity: 0.5;
    text-decoration: line-through;
}

/* TAGS */
.tag { padding:5px 10px; border-radius:20px; font-size:12px; }
.math { background:red; }
.programming { background:#00f7ff; color:black; }
.biology { background:green; }

/* LIGHT MODE */
.light {
    background: white;
    color: black;
}
.light .card, .light .post {
    background: #eee;
    color: black;
}
</style>
</head>

<body>

<header>⚡ Akashify</header>

<div class="card">
<h2>Add Task 🚀</h2>

<input id="title" placeholder="Task title">
<textarea id="content" placeholder="Write..."></textarea>

<select id="category">
<option value="math">Math</option>
<option value="programming">Programming</option>
<option value="biology">Biology</option>
</select>

<button onclick="addPost()">Add</button>
<button onclick="toggleTheme()">🎨 Theme</button>
</div>

<input id="search" placeholder="Search..." onkeyup="displayPosts()" style="margin:15px; padding:10px; width:90%;">

<div id="posts"></div>

<script>
// SERVICE WORKER
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}

// NOTIFICATION PERMISSION
if ("Notification" in window) {
    Notification.requestPermission();
}

let editIndex = -1;

// ADD POST
function addPost() {
    let title = titleInput.value;
    let content = contentInput.value;
    let category = categoryInput.value;

    if(!title || !content) return alert("Fill everything");

    let posts = JSON.parse(localStorage.getItem("posts")) || [];

    if(editIndex === -1) {
        posts.push({title, content, category, done:false});
    } else {
        posts[editIndex] = {title, content, category, done:false};
        editIndex = -1;
    }

    localStorage.setItem("posts", JSON.stringify(posts));
    titleInput.value = "";
    contentInput.value = "";

    displayPosts();
}

// DISPLAY
function displayPosts() {
    let posts = JSON.parse(localStorage.getItem("posts")) || [];
    let search = searchInput.value.toLowerCase();
    let output = "";

    posts.forEach((p,i)=>{
        if(p.title.toLowerCase().includes(search)){
            output += `
            <div class="post ${p.done?'completed':''}">
                <span class="tag ${p.category}">${p.category}</span>
                <h3>${p.title}</h3>
                <p>${p.content}</p>

                <button onclick="markDone(${i})">✔</button>
                <button onclick="remind(${i})">🔔</button>
                <button onclick="editPost(${i})">✏</button>
                <button onclick="deletePost(${i})">❌</button>
            </div>`;
        }
    });

    posts.innerHTML = output;
    document.getElementById("posts").innerHTML = output;
}

// FUNCTIONS
function markDone(i){
    let p = JSON.parse(localStorage.getItem("posts"));
    p[i].done = !p[i].done;
    localStorage.setItem("posts", JSON.stringify(p));
    displayPosts();
}

function deletePost(i){
    let p = JSON.parse(localStorage.getItem("posts"));
    p.splice(i,1);
    localStorage.setItem("posts", JSON.stringify(p));
    displayPosts();
}

function editPost(i){
    let p = JSON.parse(localStorage.getItem("posts"));
    titleInput.value = p[i].title;
    contentInput.value = p[i].content;
    categoryInput.value = p[i].category;
    editIndex = i;
}

function remind(i){
    let p = JSON.parse(localStorage.getItem("posts"));
    if(p[i].done){
        alert("Done 😎");
    } else {
        if(Notification.permission==="granted"){
            new Notification("🔔 Reminder!",{body:p[i].title});
        } else {
            alert("Finish this!");
        }
    }
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

window.onload = displayPosts;

// SHORTCUT VARIABLES
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");
const categoryInput = document.getElementById("category");
const searchInput = document.getElementById("search");
</script>

</body>
</html>
