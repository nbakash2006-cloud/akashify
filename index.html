<!DOCTYPE html>
<html>
<head>
<title>Akashify 🚀</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>⚡ Akashify Pro</header>

<div class="box">
    <input id="title" placeholder="Title">
    <textarea id="content" placeholder="Write..."></textarea>

    <select id="category">
        <option>Work</option>
        <option>Study</option>
        <option>Personal</option>
    </select>

    <button onclick="addPost()">Add Task</button>
</div>

<input id="search" placeholder="Search..." onkeyup="render()">

<div id="stats"></div>

<div id="posts"></div>

<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>
